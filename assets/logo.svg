<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 105" width="420" height="105" fill="none">
  <defs>
    <!-- Multi-stage Electric Lime Neon Glow -->
    <filter id="lime-glow" x="-20%" y="-30%" width="140%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feColorMatrix type="matrix" values="
        0 0 0 0 0.827
        0 0 0 0 0.984
        0 0 0 0 0.322
        0 0 0 0.75 0" in="blur" result="glow" />
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Sparkle Rays Neon Aura Glow -->
    <filter id="ray-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="blurRay" />
      <feColorMatrix type="matrix" values="
        0 0 0 0 0.827
        0 0 0 0 0.984
        0 0 0 0 0.322
        0 0 0 0.95 0" in="blurRay" result="glowRay" />
      <feMerge>
        <feMergeNode in="glowRay" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Contrast Drop Shadow so text pops on both light and dark GitHub backgrounds -->
    <filter id="text-shadow" x="-10%" y="-20%" width="120%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- ========================================================
       WORDMARK: "Team" in Silver-White, "Up" in Electric Lime
       ======================================================== -->
  <g filter="url(#text-shadow)">
    <!-- 'Team' in crisp white -->
    <text
      x="16"
      y="66"
      font-family="'Barlow Condensed', 'Plus Jakarta Sans', -apple-system, sans-serif"
      font-weight="900"
      font-style="italic"
      font-size="62"
      letter-spacing="-1"
      fill="#ffffff"
    >
      Team
    </text>

    <!-- 'Up' in glowing neon electric lime, anchored at x=166 -->
    <text
      x="166"
      y="66"
      font-family="'Barlow Condensed', 'Plus Jakarta Sans', -apple-system, sans-serif"
      font-weight="900"
      font-style="italic"
      font-size="62"
      letter-spacing="-1"
      fill="#d3fb52"
      filter="url(#lime-glow)"
    >
      Up
    </text>
  </g>

  <!-- ========================================================
       BALANCED 3 NEON-LIME LINES FANNING OUT ABOVE "UP"
       Positioned at x=220, y=13 directly over the 'p' of 'Up'
       Center peak upright, left/right fanning out at 28°
       ======================================================== -->
  <g id="spark-fan" transform="translate(220, 13)" filter="url(#ray-glow)">
    <!-- Left Ray: fanned out -28° to the left -->
    <g transform="translate(-11, 2) rotate(-28)">
      <rect x="-1.5" y="-5.5" width="3" height="11" rx="1.5" fill="#d3fb52" />
    </g>

    <!-- Center Ray: upright, slightly taller central spark -->
    <g transform="translate(0, -1)">
      <rect x="-1.6" y="-7" width="3.2" height="14" rx="1.6" fill="#d3fb52" />
    </g>

    <!-- Right Ray: fanned out +28° to the right -->
    <g transform="translate(11, 2) rotate(28)">
      <rect x="-1.5" y="-5.5" width="3" height="11" rx="1.5" fill="#d3fb52" />
    </g>
  </g>

  <!-- ========================================================
       SUBTITLE TAGLINE
       ======================================================== -->
  <text
    x="18"
    y="92"
    font-family="'DM Sans', 'Plus Jakarta Sans', sans-serif"
    font-weight="600"
    font-size="13.5"
    fill="#9ca3af"
    letter-spacing="1.8"
  >
    STUDENT COLLABORATION &amp; SKILLS PLATFORM
  </text>
</svg>