<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 410 105" width="410" height="105" fill="none">
  <defs>
    <!-- Intense Electric Lime Neon Glow -->
    <filter id="lime-glow" x="-20%" y="-30%" width="140%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feColorMatrix type="matrix" values="
        0 0 0 0 0.827
        0 0 0 0 0.984
        0 0 0 0 0.322
        0 0 0 0.75 0" in="blur" result="glow" />
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Sparkle Rays Glow -->
    <filter id="ray-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.5" result="blurRay" />
      <feColorMatrix type="matrix" values="
        0 0 0 0 0.827
        0 0 0 0 0.984
        0 0 0 0 0.322
        0 0 0 0.95 0" in="blurRay" result="glowRay" />
      <feMerge>
        <feMergeNode in="glowRay" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Contrast Drop Shadow so white text is legible on light & dark GitHub backgrounds -->
    <filter id="text-shadow" x="-10%" y="-20%" width="120%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Wordmark: Clean original TeamUp lockup without T badge box -->
  <g filter="url(#text-shadow)">
    <text x="14" y="64" font-family="'Barlow Condensed', 'Plus Jakarta Sans', -apple-system, sans-serif" font-weight="900" font-style="italic" font-size="62" letter-spacing="-1">
      <tspan fill="#ffffff">Team</tspan>
      <tspan fill="#d3fb52" filter="url(#lime-glow)">Up</tspan>
    </text>
  </g>

  <!-- Signature Sparkle Accent Rays above the 'p' -->
  <g transform="translate(242, 14)" filter="url(#ray-glow)">
    <rect x="0" y="4" width="3" height="9" rx="1.5" fill="#d3fb52" transform="rotate(-35)" />
    <rect x="8" y="0" width="3" height="12" rx="1.5" fill="#d3fb52" />
    <rect x="16" y="4" width="3" height="9" rx="1.5" fill="#d3fb52" transform="rotate(35)" />
  </g>

  <!-- Subtitle Tagline -->
  <text x="16" y="90" font-family="'DM Sans', 'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="13.5" fill="#9ca3af" letter-spacing="1.8">
    STUDENT COLLABORATION &amp; SKILLS PLATFORM
  </text>
</svg>