<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-label="University students collaborating across faculties">
  <defs>
    <linearGradient id="bg-hero" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3c38" />
      <stop offset="55%" stop-color="#2b4d50" />
      <stop offset="100%" stop-color="#14151c" />
    </linearGradient>
    <linearGradient id="lime-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d3fb52" />
      <stop offset="100%" stop-color="#9fe870" />
    </linearGradient>
  </defs>
  <rect width="640" height="420" rx="28" fill="url(#bg-hero)" />
  <circle cx="520" cy="80" r="130" fill="#539886" opacity="0.22" />
  <circle cx="110" cy="360" r="110" fill="#d3fb52" opacity="0.14" />

  <!-- Campus Library Arch Backdrop -->
  <path d="M90 360 V190 C90 120 175 120 175 190 V360 Z" fill="#ffffff" opacity="0.08" />
  <path d="M195 360 V170 C195 100 280 100 280 170 V360 Z" fill="#ffffff" opacity="0.11" />
  <path d="M300 360 V190 C300 120 385 120 385 190 V360 Z" fill="#ffffff" opacity="0.08" />

  <!-- Left Editorial Student Card -->
  <rect x="42" y="54" width="236" height="178" rx="22" fill="#ffffff" />
  <circle cx="96" cy="116" r="28" fill="#15733f" />
  <circle cx="96" cy="108" r="10" fill="#fde68a" />
  <path d="M78 134 C81 122 111 122 114 134" fill="#d3fb52" />
  <rect x="136" y="96" width="114" height="14" rx="7" fill="#14151c" />
  <rect x="136" y="118" width="84" height="10" rx="5" fill="#6b7280" opacity="0.55" />
  <rect x="64" y="164" width="76" height="26" rx="13" fill="#d3fb52" />
  <text x="102" y="181" text-anchor="middle" fill="#14151c" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800">React · AI</text>
  <rect x="148" y="164" width="96" height="26" rx="13" fill="#f3f6f4" />
  <text x="196" y="181" text-anchor="middle" fill="#15733f" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700">Cairo Univ</text>
  <rect x="64" y="200" width="180" height="12" rx="6" fill="#e5e7eb" />

  <!-- Right Floating Squad Card -->
  <rect x="330" y="92" width="268" height="202" rx="24" fill="#14151c" stroke="rgba(211,251,82,0.45)" stroke-width="2" />
  <rect x="354" y="116" width="118" height="26" rx="13" fill="url(#lime-card)" />
  <text x="413" y="133" text-anchor="middle" fill="#14151c" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800">TEAM MATCHED</text>
  <!-- Avatar Stack -->
  <circle cx="378" cy="184" r="22" fill="#d3fb52" stroke="#14151c" stroke-width="3" />
  <circle cx="408" cy="184" r="22" fill="#38bdf8" stroke="#14151c" stroke-width="3" />
  <circle cx="438" cy="184" r="22" fill="#10b981" stroke="#14151c" stroke-width="3" />
  <circle cx="468" cy="184" r="22" fill="#ffffff" stroke="#14151c" stroke-width="3" />
  <text x="468" y="188" text-anchor="middle" fill="#14151c" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800">+3</text>
  <rect x="354" y="226" width="210" height="14" rx="7" fill="#ffffff" />
  <rect x="354" y="250" width="150" height="11" rx="5.5" fill="#9ca3af" opacity="0.6" />

  <!-- Bottom Floating Live Pill -->
  <rect x="116" y="294" width="330" height="72" rx="20" fill="#ffffff" />
  <circle cx="156" cy="330" r="18" fill="#d3fb52" />
  <path d="M149 330 L154 335 L164 325" fill="none" stroke="#14151c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <text x="190" y="324" fill="#14151c" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="800">Verified Student Squad</text>
  <text x="190" y="344" fill="#4b5563" font-family="'DM Sans', sans-serif" font-size="12">12 Egyptian Partner Campuses</text>
</svg>
