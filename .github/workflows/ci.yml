name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-build-and-test:
    name: Backend Build & Test (.NET 11)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'

      - name: Restore dependencies
        run: dotnet restore backend/TeamUp.sln

      - name: Build solution
        run: dotnet build backend/TeamUp.sln --no-restore --configuration Release

      - name: Run unit & integration tests
        run: dotnet test backend/TeamUp.sln --no-build --configuration Release --verbosity normal

      - name: Install dotnet-ef tool
        run: dotnet tool restore

      - name: Verify migration idempotency & zero cascades
        run: |
          dotnet ef migrations script --project backend/src/TeamUp.Infrastructure --startup-project backend/src/TeamUp.Api -i -o idempotency-check.sql
          if grep -E "ON DELETE CASCADE|ON DELETE SET NULL" idempotency-check.sql; then
            echo "ERROR: Physical cascades or SET NULL detected in generated SQL!"
            exit 1
          fi
          echo "Verified: Zero physical cascades in generated migrations."

  frontend-build-and-test:
    name: Frontend Build & Test (React + Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm run test

      - name: Type-check & build production bundle
        run: npm run build

  e2e-playwright-smoke:
    name: E2E Smoke Suite (Playwright + .NET 11 API)
    runs-on: ubuntu-latest
    needs: [backend-build-and-test, frontend-build-and-test]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build TeamUp.Api for E2E webServer
        run: dotnet build backend/src/TeamUp.Api/TeamUp.Api.csproj

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright Chromium browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run M1 Playwright E2E smoke suite
        working-directory: frontend
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-e2e-report
          path: frontend/playwright-report/
          retention-days: 7
