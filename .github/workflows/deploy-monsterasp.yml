name: Deploy Backend to MonsterASP.NET

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-monsterasp.yml'

jobs:
  deploy-backend:
    name: Publish & WebDeploy .NET 10 API
    runs-on: windows-latest
    environment: production

    steps:
      - name: Check MonsterASP.NET deployment secrets
        id: secrets-check
        env:
          MONSTERASP_SERVER: ${{ secrets.MONSTERASP_SERVER }}
          MONSTERASP_SITE_NAME: ${{ secrets.MONSTERASP_SITE_NAME }}
          MONSTERASP_USERNAME: ${{ secrets.MONSTERASP_USERNAME }}
          MONSTERASP_PASSWORD: ${{ secrets.MONSTERASP_PASSWORD }}
        run: |
          $hasAll = -not (
            [string]::IsNullOrWhiteSpace($env:MONSTERASP_SERVER) -or
            [string]::IsNullOrWhiteSpace($env:MONSTERASP_SITE_NAME) -or
            [string]::IsNullOrWhiteSpace($env:MONSTERASP_USERNAME) -or
            [string]::IsNullOrWhiteSpace($env:MONSTERASP_PASSWORD)
          )
          if ($hasAll) {
            "configured=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          } else {
            Write-Host "Skipping MonsterASP.NET deploy: MONSTERASP_* secrets are not configured yet."
            "configured=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }

      - name: Checkout repository
        if: steps.secrets-check.outputs.configured == 'true'
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        if: steps.secrets-check.outputs.configured == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish Release package
        if: steps.secrets-check.outputs.configured == 'true'
        run: |
          dotnet publish backend/src/TeamUp.Api/TeamUp.Api.csproj -c Release -o "${{ github.workspace }}\publish"
          Remove-Item -Path "${{ github.workspace }}\publish\appsettings.Development.json" -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "${{ github.workspace }}\publish\appsettings.Production.example.json" -Force -ErrorAction SilentlyContinue
          Get-ChildItem -Path "${{ github.workspace }}\publish" -Filter "*.dev.db*" -ErrorAction SilentlyContinue | Remove-Item -Force
          $runtimesDir = "${{ github.workspace }}\publish\runtimes"
          if (Test-Path $runtimesDir) {
            $keepRuntimes = @("win", "win-x64", "win-x86")
            $pruned = Get-ChildItem -Path $runtimesDir -Directory | Where-Object { $keepRuntimes -notcontains $_.Name }
            foreach ($dir in $pruned) {
              Remove-Item -Path $dir.FullName -Recurse -Force
            }
            $publishMB = [math]::Round(((Get-ChildItem -Path "${{ github.workspace }}\publish" -Recurse -File | Measure-Object Length -Sum).Sum / 1MB), 2)
            Write-Host "Pruned $($pruned.Count) non-Windows runtime folders; publish payload size is ${publishMB} MB."
          }

      - name: Write optional appsettings.Production.json from secret
        if: steps.secrets-check.outputs.configured == 'true'
        env:
          MONSTERASP_APPSETTINGS_JSON: ${{ secrets.MONSTERASP_APPSETTINGS_JSON }}
        run: |
          if (-not [string]::IsNullOrWhiteSpace($env:MONSTERASP_APPSETTINGS_JSON)) {
            $rawJson = $env:MONSTERASP_APPSETTINGS_JSON.Trim().TrimStart([char]0xFEFF).Trim()
            $cfg = $rawJson | ConvertFrom-Json
            if ($null -ne $cfg.Seed) {
              if ($cfg.Seed.Enabled -eq $true) {
                Write-Warning "Forcing Seed.Enabled=false in published appsettings.Production.json for ongoing production deploy."
                $cfg.Seed.Enabled = $false
              }
              if ($cfg.Seed.PSObject.Properties['AdminPassword']) {
                $cfg.Seed.PSObject.Properties.Remove('AdminPassword')
              }
            }
            if ($null -ne $cfg.Email) {
              $hasBase = $cfg.Email.PSObject.Properties['FrontendBaseUrl'] -and -not [string]::IsNullOrWhiteSpace($cfg.Email.FrontendBaseUrl)
              if (-not $hasBase) {
                $derivedOrigin = "https://teamup-ieee.vercel.app"
                if ($cfg.Email.PSObject.Properties['ResetPasswordUrlBase'] -and -not [string]::IsNullOrWhiteSpace($cfg.Email.ResetPasswordUrlBase)) {
                  try {
                    $u = [Uri]$cfg.Email.ResetPasswordUrlBase
                    if ($u.Scheme -eq 'https') {
                      $derivedOrigin = "$($u.Scheme)://$($u.Authority)"
                    }
                  } catch {}
                }
                $cfg.Email | Add-Member -NotePropertyName 'FrontendBaseUrl' -NotePropertyValue $derivedOrigin -Force
                Write-Host "Defaulted Email.FrontendBaseUrl to $derivedOrigin in published appsettings.Production.json."
              }
            }
            $normalizedJson = $cfg | ConvertTo-Json -Depth 20
            $utf8NoBom = [System.Text.UTF8Encoding]::new($false)
            [System.IO.File]::WriteAllText("${{ github.workspace }}\publish\appsettings.Production.json", $normalizedJson, $utf8NoBom)
            Write-Host "Wrote normalized appsettings.Production.json from secret."
          }

      - name: Deploy to MonsterASP.NET via WebDeploy
        if: steps.secrets-check.outputs.configured == 'true'
        env:
          MONSTERASP_SERVER: ${{ secrets.MONSTERASP_SERVER }}
          MONSTERASP_SITE_NAME: ${{ secrets.MONSTERASP_SITE_NAME }}
          MONSTERASP_USERNAME: ${{ secrets.MONSTERASP_USERNAME }}
          MONSTERASP_PASSWORD: ${{ secrets.MONSTERASP_PASSWORD }}
        run: |
          $msdeployCmd = Get-Command msdeploy.exe -ErrorAction SilentlyContinue
          $msdeploy = if ($msdeployCmd) {
            $msdeployCmd.Source
          } elseif (Test-Path "${env:ProgramFiles}\IIS\Microsoft Web Deploy V3\msdeploy.exe") {
            "${env:ProgramFiles}\IIS\Microsoft Web Deploy V3\msdeploy.exe"
          } elseif (Test-Path "${env:ProgramFiles(x86)}\IIS\Microsoft Web Deploy V3\msdeploy.exe") {
            "${env:ProgramFiles(x86)}\IIS\Microsoft Web Deploy V3\msdeploy.exe"
          } else {
            throw "msdeploy.exe was not found on the runner."
          }

          $rawServer = $env:MONSTERASP_SERVER.Trim()
          $site = $env:MONSTERASP_SITE_NAME.Trim()
          $user = $env:MONSTERASP_USERNAME.Trim()
          $pass = $env:MONSTERASP_PASSWORD.Trim("`r", "`n")

          $serverForUri = if ($rawServer -match '^https?://') { $rawServer } else { "https://$rawServer" }
          $parsedUri = [Uri]$serverForUri
          $port = if ($parsedUri.IsDefaultPort -or $parsedUri.Port -le 0) { 8172 } else { $parsedUri.Port }
          $computerUrl = "https://$($parsedUri.Host):$port/msdeploy.axd?site=$([Uri]::EscapeDataString($site))"

          Write-Host "Site format check: hasScheme=$($site -match '://'), hasRunAspNet=$($site -match '\.runasp\.net'), empty=$($site.Length -eq 0)"
          Write-Host "Server format check: port=$port, hasMsdeployPath=$($rawServer -match 'msdeploy\.axd'), hadSiteQuery=$($rawServer -match 'site=')"
          Write-Host "Auth presence check: userNonEmpty=$($user.Length -gt 0), passNonEmpty=$($pass.Length -gt 0), usernameEqualsSite=$($user -eq $site)"
          if ($site -match '://' -or $site -match '\.runasp\.net') {
            Write-Warning "MONSTERASP_SITE_NAME should be your MonsterASP IIS site ID (for example site12345), not an HTTP URL or .runasp.net domain."
          }

          $escapeSetting = { param([string]$v) $v.Replace("'", "''") }
          $escSite = & $escapeSetting $site
          $escUrl = & $escapeSetting $computerUrl
          $escUser = & $escapeSetting $user
          $escPass = & $escapeSetting $pass

          & $msdeploy `
            "-verb:sync" `
            "-source:iisApp='${{ github.workspace }}\publish'" `
            "-dest:iisApp='$escSite',computerName='$escUrl',userName='$escUser',password='$escPass',authType='Basic'" `
            "-enableRule:AppOffline" `
            "-enableRule:DoNotDeleteRule" `
            "-allowUntrusted"
          if ($LASTEXITCODE -ne 0) {
            throw "WebDeploy exited with code $LASTEXITCODE."
          }
